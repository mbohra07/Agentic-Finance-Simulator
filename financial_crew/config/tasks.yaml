simulate_cash_flow:
  description: >
    <<SYS>>
    You are a financial simulation assistant. Always respond ONLY with the final output.
    NEVER include prep statements like "Now I can answer", "Here's the result", or reasoning.
    Only output structured JSON.
    <</SYS>>
    Simulate {simulation_steps}-step cash flow for {user_name}, a {age}-year-old {occupation} with ₹{starting_balance} and income ₹{income_level}.

    Include:
    - Inflows: salary, freelance, investment_return, surprise_income
    - Outflows: rent, groceries, transport, entertainment, impulse, medical, guilt, retail_therapy
    - Emotional/irrational behavior (simulate with emotional_bias_agent)
    - Random events: job loss, bonus, gift, medical emergency

    Constraints:
    - Outflows ≤ inflows + balance
    - Prioritize essentials (rent, groceries, medical); reduce non-essentials if needed

  expected_output: >
    Return JSON list with inflows, outflows, and balance per step:

    [
      {
        "date": "YYYY-MM-DD",
        "time_to_goal_left": 0,
        "inflows": {
          "salary": ₹,
          "freelance": ₹,
          "investment_return": ₹,
          "unexpected_income": ₹
        },
        "outflows": {
          "rent": ₹,
          "groceries": ₹,
          "transport": ₹,
          "entertainment": ₹,
          "impulse_spending": ₹,
          "medical": ₹,
          "guilt_spending": ₹,
          "retail_therapy": ₹
        },
        "balance": ₹
      }
    ]

  agent: emotional_bias_agent
  frequency: monthly
  output_file: output/simulated_cashflow.json
  retry_policy:
    max_retries: 2
    retry_interval: 45s
    
evaluate_spending:
  description: >
    <<SYS>>
    You are a financial simulation assistant. Always respond ONLY with the final output.
    NEVER include prep statements like "Now I can answer", "Here's the result", or reasoning.
    Only the required output.
    <</SYS>>
    Analyze {{user_name}}’s spending. Flag inefficiencies using:
    - Occupation: {{occupation}}
    - Income: ₹{{income_level}}
    - Goal: "{{goal}}"

    Use principles of opportunity cost, budget allocation, and utility.
    🎯 Tip: Boost savings without affecting essentials.
  expected_output: |
    Spending Review & Suggestions for {{user_name}}:
    - [Top 3 wasteful expenses, ₹]
    - Overspending categories (vs benchmarks)
    - Savings rate & how to improve
    - Simple tips for consistency
    - Tip: Adjust based on inflation={{economic_context.inflation*100}}%, COL={{economic_context.cost_of_living_index}}, interest={{economic_context.interest_rate*100}}%
  agent: spending_advisor
  context: 
  - simulate_cash_flow
  output_file: output/spending_review.md

track_goals:
  description: >
    <<SYS>>
    You are a financial simulation assistant. Always respond ONLY with the final output.
    NEVER include prep statements like "Now I can answer", "Here's the result", or reasoning.
    <</SYS>>
    Evaluate {{user_name}}’s progress toward goal: "{{goal}}"
    Based on {{simulation_steps}}-step simulation and economic context.
  expected_output: |
    📊 Goal Progress Summary:
    - Goal: "{{goal}}"
    - Achieved: % of goal
    - Projected: ₹amount
    - Time left: estimate
    🧠 Tip: Adjust based on inflation={{economic_context.inflation*100}}%, COL={{economic_context.cost_of_living_index}}, interest={{economic_context.interest_rate*100}}%
  agent: goal_tracker
  context: 
  - simulate_cash_flow
  output_file: output/goal_tracking.md
  retry_policy: { max_retries: 2, retry_interval: 30s }

coordinator_decision:
  description: >
    <<SYS>>
    You are a financial simulation assistant. Always respond ONLY with the final output.
    NEVER include prep statements like "Now I can answer", "Here's the result", or reasoning.
    Only output structured JSON.
    <</SYS>>
    You are the Agent Coordinator. Merge outputs from Spending and Goal Tracker.
    Choose final action. If conflicts, reconcile.
  expected_output: |
    {
      "final_action": "...",
      "rationale": "...",
      "emotional_behavior": "...",
      "summary_of_spending": "...",
      "summary_of_goals": "...",
      "recommendations": [...]
    }
  agent: agent_coordinator
  context: 
  - evaluate_spending
  - track_goals
  output_file: output/coordinator_context.json
  retry_policy: { max_retries: 2, retry_interval: 30s }

monthly_summary:
  description: >
    <<SYS>>
    You are a financial simulation assistant. Always respond ONLY with the final output.
    NEVER include prep statements like "Now I can answer", "Here's the result", or reasoning.
    Only output structured JSON.
    <</SYS>>
    Write a clear monthly financial report from coordinator_decision and simulate_cash_flow.
    Include spending behavior, goal tracking, emotion triggers, and advice.
  expected_output: |
    ## Overview & Highlights
    ## Cash Flow Summary
    ## Spending Behavior & Emotional Patterns
    ## Goal Progress & Recommendations
    ## Coordinator Recommendation
    ## Suggestions for Next Month
  agent: mentor_agent
  context: 
  - simulate_cash_flow
  - coordinator_decision
  output_file: output/report.md
  retry_policy: { max_retries: 2, retry_interval: 60s }