simulate_cash_flow:
  description: >
    <<SYS>>
    You are a financial simulation assistant. Always respond ONLY with the final output.
    NEVER include prep statements like "Now I can answer", "Here's the result", or reasoning.
    Only output an array of objects with keys:
    "date", "time_to_goal_left", "inflows", "outflows", "balance", "User".
    "inflows" must have "salary", "freelance", "investment_return", "unexpected_income".
    "outflows" must have "rent", "groceries", "transport", "entertainment", "impulse_spending", "medical", "guilt_spending", "retail_therapy".
    All keys must always be present. No text outside the JSON.
    <</SYS>>

    Simulate cash flows for that {simulation_unit} for {user_name}, a {age}-year-old {occupation} with ₹{starting_balance} and income ₹{income_level}.

    {cashflow_context}

    Include:
    - Inflows: {monthly_earning}, salary, freelance, investment_return, surprise_income
    - Outflows: {monthly_expenses}, rent, groceries, transport, entertainment, impulse, medical, guilt, retail_therapy
    - Emotional/irrational behavior (simulate with emotional_bias_agent)
    - Random events: job loss, bonus, gift, medical emergency
    - Choices: delay gratification, switch career, donate to cause

    Constraints:
    - Outflows ≤ inflows 
    - Prioritize essentials (rent, groceries, medical); reduce non-essentials if needed
    - Include savings behavior, saving {percentage_of_my_savings}% of {monthly_earning} towards savings goal of ₹{savings_target}.
    - Track monthly progress towards savings target.

  expected_output: >
    [
      {
        "date": "YYYY-MM-DD",
        "time_to_goal_left": 0,
        "inflows": {
          "salary": ₹,
          "freelance": ₹,
          "investment_return": ₹,
          "unexpected_income": ₹
        },
        "outflows": {
          "rent": ₹,
          "groceries": ₹,
          "transport": ₹,
          "entertainment": ₹,
          "impulse_spending": ₹,
          "medical": ₹,
          "guilt_spending": ₹,
          "retail_therapy": ₹
        },
        "balance": ₹,
        "User": "{user_name}"
      }
    ]

  agent: emotional_bias_agent
  output_file: output/simulated_cashflow.json
  retry_policy:
    max_retries: 3
    retry_interval: 45s

evaluate_spending:
  description: >
    <<SYS>>
    You are a financial simulation assistant. Always respond ONLY with the final output.
    NEVER include prep statements like "Now I can answer", "Here's the result", or reasoning.

    Each object must have these keys:
    - "user_name" (string)
    - "occupation" (string)
    - "income" (string)
    - "goal" (string)
    - "savings_target" (string)
    - "savings_rate" (string with % sign, e.g., "20%")
    - "top_wasteful_expenses" (array of 3 objects with "category" and "amount" as string with ₹ sign)
    - "overspending_categories" (array of 1+ objects with "category" and "benchmark_variance" as string with % sign)
    - "savings_rate_assessment" (object with "current_rate" (string with % sign), "suggested_improvement" (string with % sign), "notes" (string))
    - "consistency_tips" (array of at least 3 actionable tips as strings)

    All keys must be present in every object. Return only JSON, no text outside it.
    <</SYS>>
    Analyze {user_name}’s spending. Flag inefficiencies using:
    - Occupation: {occupation}
    - Income: ₹{income_level}
    - Goal: "{goal}"
    - Savings Target: ₹{savings_target}
    - Savings Rate: {percentage_of_my_savings}%

    Use principles of opportunity cost, budget allocation, and utility.
    Tip: Adjust based on inflation={inflation}, COL={cost_of_living_index}, interest={interest_rate}
  expected_output: |
    [
      {
        "user_name": "{user_name}",
        "occupation": "{occupation}",
        "income": "{income_level}",
        "goal": "{goal}",
        "savings_target": "{savings_target}",
        "savings_rate": "{percentage_of_my_savings}%",
        "top_wasteful_expenses": [
          { "category": "X", "amount": "Y" },
          { "category": "X", "amount": "Y" },
          { "category": "X", "amount": "Y" }
        ],
        "overspending_categories": [
          { "category": "X", "benchmark_variance": "+Z%" }
        ],
        "savings_rate_assessment": {
          "current_rate": %,
          "suggested_improvement": "+N%",
          "notes": "e.g., divert X expense toward savings"
        },
        "List of consistency_tips": 
      }
    ]
  agent: spending_advisor
  output_file: output/spending_review.json
  retry_policy: { max_retries: 3, retry_interval: 45s }

